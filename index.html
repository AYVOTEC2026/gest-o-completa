<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYVO Complexo — Piloto Premium</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1114}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="appFrame" src="original.html" title="AYVO Complexo"></iframe>
<script>
const frame=document.getElementById('appFrame');
const DEMO_DATE='20/09/2026';

function safeText(v){return String(v??'').replace(/\s+/g,' ').trim()}
function ascii(v){return safeText(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'-')}
function pdfEsc(v){return ascii(v).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function makePdf(title,subtitle,lines,filename){
  const clean=[ascii(title),ascii(subtitle||''),'',...lines.map(ascii),'','AYVO Tecnologia | Inteligencia que transforma','DADOS FICTICIOS PARA DEMONSTRACAO COMERCIAL'];
  const ops=[];ops.push('BT','/F1 19 Tf','50 795 Td',`(${pdfEsc(clean[0])}) Tj`,'/F1 10 Tf','0 -24 Td');
  if(clean[1]){ops.push(`(${pdfEsc(clean[1])}) Tj`,'0 -18 Td')} else ops.push('0 -8 Td');
  ops.push('/F1 9 Tf');
  clean.slice(2).forEach((line,i)=>{if(i>0)ops.push('0 -15 Td');ops.push(`(${pdfEsc(line)}) Tj`)});ops.push('ET');
  const stream=ops.join('\n');
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  objs[5]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  let out='%PDF-1.4\n';const offsets=[0];
  for(let i=1;i<=5;i++){offsets[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
  const xref=out.length;out+='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)out+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  downloadBlob(filename,new Blob([out],{type:'application/pdf'}));
}
function downloadCsv(name,rows){
  const body=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  downloadBlob(name,new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}));
}
function proposalPdf(w){
  makePdf('PROPOSTA COMERCIAL - FESTA HELENA','Complexo Familia Fortaleza - '+DEMO_DATE,[
    'Pacote: Familia Premium','Evento: aniversario infantil','Data: 26/09/2026 - 16:00','Convidados: 45',
    'Inclusos: Espaco A, parque infantil, 1 hora de quadra, mesas e cadeiras','Valor total: R$ 2.950,00',
    'Sinal recebido: R$ 1.500,00','Saldo: R$ 1.450,00','Validade desta proposta: 5 dias',
    'Responsavel comercial: Equipe AYVO Demo'
  ],'AYVO_Proposta_Festa_Helena_Demo.pdf'); w.toast('PDF real da proposta baixado com dados ficticios');
}
function contractPdf(w,row){
  const cells=row?[...row.cells].map(c=>safeText(c.innerText)):['01','Pizza do Point','R$ 4.200','05/09','03/2027','Pago'];
  makePdf('CONTRATO DE LOCACAO - DEMONSTRACAO','Complexo Familia Fortaleza',[ 
    'Espaco: Conteiner '+cells[0],'Operacao: '+cells[1],'Valor mensal: '+cells[2],'Vencimento: '+cells[3],
    'Vigencia informada: '+cells[4],'Status financeiro: '+cells[5],
    'Clausula demonstrativa: uso comercial do espaco conforme regras internas do complexo.',
    'Reajuste: anual conforme indice definido em contrato.','Caucao e consumos individuais: conforme negociacao comercial.'
  ],`AYVO_Contrato_${ascii(cells[1]).replace(/\s+/g,'_')}_Demo.pdf`); w.toast('Contrato demonstrativo baixado em PDF');
}
function financialPdf(w){
  makePdf('RELATORIO FINANCEIRO GERENCIAL','Competencia: Setembro/2026',[ 
    'Receita do mes: R$ 82.310,00','Previsao do mes: R$ 96.480,00','A receber: R$ 14.170,00',
    'Despesas operacionais: R$ 31.840,00','Resultado operacional: R$ 50.470,00','Margem operacional: 61,3%',
    'Locacoes: R$ 40.800,00','Parque infantil: R$ 13.740,00','Quadras: R$ 16.920,00','Festas: R$ 10.850,00',
    'Inadimplencia demonstrativa: R$ 7.800,00 - 2 clientes'
  ],'AYVO_Relatorio_Financeiro_Setembro_2026_Demo.pdf');w.toast('Relatorio financeiro baixado em PDF');
}
function occupancyPdf(w){
  makePdf('RELATORIO DE OCUPACAO','Periodo demonstrativo: ultimos 30 dias',[ 
    'Conteineres: 10 de 12 ocupados - 83%','Parque infantil: ocupacao media 58%','Quadras: ocupacao media 76%',
    'Festas e eventos: 8 realizadas/contratadas no mes','Pico previsto do parque: 18:00','Reservas de quadra hoje: 18',
    'Ocupacao media consolidada: 74%'
  ],'AYVO_Relatorio_Ocupacao_Demo.pdf');w.toast('Relatorio de ocupacao baixado em PDF');
}
function crmPdf(w){
  makePdf('RELATORIO CRM E WHATSAPP','Base demonstrativa - ultimos 90 dias',[ 
    'Clientes cadastrados: 1.842','Novos clientes: 428','Clientes recorrentes: 773','Recorrencia: 42%',
    'Mensagens enviadas: 3.218','Taxa demonstrativa de entrega: 98,4%','Campanhas ativas: 4',
    'Segmento Familias frequentes: 214 contatos','Segmento Clientes de quadra: 338 contatos',
    'Aniversarios proximos: 54 contatos','Inativos ha 60 dias: 187 contatos'
  ],'AYVO_Relatorio_CRM_Demo.pdf');w.toast('Relatorio de CRM baixado em PDF');
}
function exportExcel(w){
  downloadCsv('AYVO_Indicadores_Demo.csv',[
    ['Indicador','Valor','Periodo'],['Receita recorrente','R$ 40.800,00','Set/2026'],['Receita variavel','R$ 41.510,00','Set/2026'],
    ['Ocupacao media','74%','30 dias'],['Clientes novos','428','90 dias'],['Clientes recorrentes','773','90 dias'],
    ['Ticket medio','R$ 117,40','90 dias'],['WhatsApp entregue','98,4%','Set/2026']
  ]);w.toast('Planilha CSV baixada com dados demonstrativos');
}
function charge(w,btn){
  const row=btn.closest('tr'); if(row){const badge=row.querySelector('.status');if(badge){badge.className='status info';badge.textContent='Cobranca enviada'}btn.textContent='Reenviar';}
  w.toast('Cobranca demonstrativa enviada pelo WhatsApp');
}
function renew(w,btn){
  const row=btn.closest('tr');if(!row)return;const cells=row.cells;cells[4].textContent='08/10/2027';cells[5].innerHTML='<span class="status ok">Renovado</span>';btn.textContent='Contrato';btn.onclick=()=>contractPdf(w,row);w.toast('Contrato renovado por 12 meses na demonstracao');
}
function wireRentalFilters(d){
  const sec=d.getElementById('locacoes');if(!sec)return;const input=sec.querySelector('.toolbar input'),sel=sec.querySelector('.toolbar select');
  const run=()=>{const q=(input.value||'').toLowerCase(),f=(sel.value||'Todos').toLowerCase();sec.querySelectorAll('.map .unit').forEach(u=>{const t=u.innerText.toLowerCase();const okQ=!q||t.includes(q);const okF=f==='todos'||(f==='em dia'&&t.includes('em dia'))||(f==='vencido'&&t.includes('vencido'))||(f==='disponível'&&t.includes('dispon'));u.style.display=okQ&&okF?'':'none'});};
  input.addEventListener('input',run);sel.addEventListener('change',run);
}
function customModal(d,w,title,fields,onSave){
  let bg=d.getElementById('ayvoCustomModal');if(bg)bg.remove();bg=d.createElement('div');bg.className='modal-bg show';bg.id='ayvoCustomModal';
  bg.innerHTML=`<div class="modal"><div class="modal-top"><h3>${title}</h3><button class="close" id="ayvoClose">×</button></div><div class="form-grid">${fields.map((f,i)=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.type==='select'?`<select data-f="${i}">${f.options.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input data-f="${i}" type="${f.type||'text'}" value="${f.value||''}" placeholder="${f.placeholder||''}">`}</div>`).join('')}</div><div class="actions-row"><button class="btn" id="ayvoCancel">Cancelar</button><button class="btn primary" id="ayvoSave">Salvar</button></div></div>`;
  d.body.appendChild(bg);const close=()=>bg.remove();d.getElementById('ayvoClose').onclick=close;d.getElementById('ayvoCancel').onclick=close;bg.addEventListener('click',e=>{if(e.target===bg)close()});
  d.getElementById('ayvoSave').onclick=()=>{const vals=fields.map((_,i)=>bg.querySelector(`[data-f="${i}"]`).value);onSave(vals);close()};
}
function addUserModal(d,w){customModal(d,w,'Novo usuario demonstrativo',[{label:'Nome',value:'Ana Martins'},{label:'E-mail',value:'ana@complexofamilia.com.br'},{label:'Perfil',type:'select',options:['Administrador','Caixa / Recepcao','Monitor do parque','Eventos']}],v=>{
  const card=[...d.querySelectorAll('#config .card')].find(c=>c.innerText.includes('Perfis e permissões'));const row=d.createElement('div');row.className='row';row.innerHTML=`<div class="round">${v[0].split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}</div><div><b>${v[0]}</b><small>${v[2]} • ${v[1]}</small></div><span class="status info">Novo</span>`;card.appendChild(row);w.toast('Usuario demonstrativo criado com sucesso');
})}
function addIntegrationButtons(d,w){
  const card=[...d.querySelectorAll('#config .card')].find(c=>c.innerText.includes('Integrações'));if(!card||card.dataset.wired)return;card.dataset.wired='1';
  card.querySelectorAll('.metric').forEach(m=>{const name=safeText(m.querySelector('span')?.innerText);const b=m.querySelector('b');const btn=d.createElement('button');btn.className='btn';btn.style.marginLeft='8px';btn.textContent='Testar';btn.onclick=()=>{b.textContent='Conectado (demo)';b.style.color='var(--green)';w.toast(name+' validado na demonstracao')};m.appendChild(btn)});
}
function installDemoTools(d,w){
  w.gerarPdfProposta=()=>proposalPdf(w);w.gerarPdfFinanceiro=()=>financialPdf(w);w.gerarPdfOcupacao=()=>occupancyPdf(w);w.gerarPdfCRM=()=>crmPdf(w);w.exportarExcelDemo=()=>exportExcel(w);
  const party=d.getElementById('festas');if(party){const b=[...party.querySelectorAll('button')].find(x=>safeText(x.innerText)==='Gerar PDF');if(b)b.onclick=()=>proposalPdf(w);const send=[...party.querySelectorAll('button')].find(x=>safeText(x.innerText).includes('Enviar contrato'));if(send)send.onclick=()=>{send.textContent='Contrato enviado';send.classList.remove('primary');send.classList.add('soft');w.toast('Contrato demonstrativo enviado para assinatura eletrônica')}}
  const fin=d.getElementById('financeiro');if(fin){[...fin.querySelectorAll('button')].forEach(b=>{if(safeText(b.innerText)==='Exportar')b.onclick=()=>financialPdf(w);if(safeText(b.innerText)==='Cobrar'&&!b.dataset.wired){b.dataset.wired='1';b.onclick=()=>charge(w,b)}})}
  const loc=d.getElementById('locacoes');if(loc){const rows=loc.querySelectorAll('tbody tr');rows.forEach(r=>{[...r.querySelectorAll('button')].forEach(b=>{const t=safeText(b.innerText);if(t==='Ver contrato')b.onclick=()=>contractPdf(w,r);if(t==='Cobrar')b.onclick=()=>charge(w,b);if(t==='Renovar')b.onclick=()=>renew(w,b)})})}
  const rep=d.getElementById('relatorios');if(rep){const ex=[...rep.querySelectorAll('button')];ex.forEach(b=>{const t=safeText(b.innerText);if(t==='Financeiro')b.onclick=()=>financialPdf(w);if(t==='Ocupação')b.onclick=()=>occupancyPdf(w);if(t==='CRM')b.onclick=()=>crmPdf(w)});const card=[...rep.querySelectorAll('.card')].find(c=>c.innerText.includes('Exportações'));if(card&&!card.querySelector('[data-excel]')){const b=d.createElement('button');b.className='btn full';b.dataset.excel='1';b.style.marginTop='8px';b.textContent='Excel / CSV';b.onclick=()=>exportExcel(w);card.appendChild(b)}}
  const cfg=d.getElementById('config');if(cfg){const newUser=[...cfg.querySelectorAll('button')].find(b=>safeText(b.innerText)==='Novo usuário');if(newUser)newUser.onclick=()=>addUserModal(d,w);addIntegrationButtons(d,w);if(!cfg.querySelector('[data-reset-demo]')){const reset=d.createElement('button');reset.className='btn danger';reset.dataset.resetDemo='1';reset.textContent='Restaurar dados da apresentação';reset.onclick=()=>{if(confirm('Restaurar a demonstração para os dados iniciais?'))frame.contentWindow.location.reload()};cfg.prepend(reset)}}
  wireRentalFilters(d);
}
function overrideSaves(d,w){
  const original=w.demoSave;
  w.demoSave=function(id,msg){
    if(id==='courtModal'){
      const m=d.getElementById(id),inputs=m.querySelectorAll('input,select');const client=safeText(inputs[0].value)||'Grupo Demo',court=safeText(inputs[2].value),time=safeText(inputs[4].value)||'19:00';
      const day=d.querySelector('#quadras .day');const slot=d.createElement('div');slot.className='slot';slot.innerHTML=`<b>${time}</b>${court} • ${client}`;day.appendChild(slot);
    }
    if(id==='partyModal'){
      const m=d.getElementById(id),ins=m.querySelectorAll('input,select');const name=safeText(ins[0].value)||'Familia Demonstracao',people=safeText(ins[4].value)||'40';const st=d.querySelector('#festas .stage');const deal=d.createElement('div');deal.className='deal';deal.innerHTML=`<b>${name}</b><small>${people} convidados • proposta criada agora</small>`;st.appendChild(deal);
    }
    if(id==='contractModal'){
      const m=d.getElementById(id),ins=m.querySelectorAll('input,select');const unit=safeText(ins[0].value).replace('Contêiner ','')||'11',company=safeText(ins[1].value)||'Nova Operacao Demo',value=safeText(ins[4].value)||'R$ 4.000,00';
      const units=[...d.querySelectorAll('#locacoes .unit.free')];const u=units.find(x=>safeText(x.querySelector('.n')?.innerText)===unit)||units[0];if(u){u.classList.remove('free');u.querySelector('b').textContent=company;u.querySelector('small').textContent=value+' • Em dia';}
      const tb=d.querySelector('#locacoes tbody');if(tb){const tr=d.createElement('tr');tr.innerHTML=`<td>${unit}</td><td>${company}</td><td>${value}</td><td>05/10</td><td>09/2027</td><td><span class="status ok">Pago</span></td><td><button class="btn">Ver contrato</button></td>`;tr.querySelector('button').onclick=()=>contractPdf(w,tr);tb.appendChild(tr)}
    }
    if(id==='campaignModal'){
      const m=d.getElementById(id),s=m.querySelectorAll('select'),ta=m.querySelector('textarea');const card=[...d.querySelectorAll('#crm .card')].find(c=>c.innerText.includes('Automações de WhatsApp'));if(card){const row=d.createElement('div');row.className='metric';row.innerHTML=`<span>Campanha: ${safeText(s[0].value)}</span><b style="color:var(--green)">${safeText(s[1].value)==='Agora'?'Enviada':'Agendada'}</b>`;card.appendChild(row)};msg='Campanha demonstrativa registrada: '+safeText(ta.value).slice(0,46)+'...';
    }
    original.call(w,id,msg);
  }
}
function wireLooseButtons(d,w){
  d.querySelectorAll('button.btn').forEach(b=>{
    if(b.onclick)return;const t=safeText(b.innerText);
    if(t==='Cobrar')b.onclick=()=>charge(w,b);
    else if(t==='Ver contrato')b.onclick=()=>contractPdf(w,b.closest('tr'));
  });
}
function addDemoBanner(d){
  if(d.getElementById('ayvoDemoBadge'))return;const s=d.createElement('div');s.id='ayvoDemoBadge';s.textContent='DEMO • dados fictícios';s.style.cssText='position:fixed;right:18px;top:18px;z-index:999;background:#11161b;color:#fff;border:1px solid rgba(255,255,255,.14);padding:7px 10px;border-radius:999px;font:700 10px Inter,Arial;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:none';d.body.appendChild(s);
}
function boot(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!d||!w)return;try{overrideSaves(d,w);installDemoTools(d,w);wireLooseButtons(d,w);addDemoBanner(d);w.toast('Modo apresentação carregado • documentos e ações funcionais')}catch(e){console.error('AYVO demo boot',e)}
}
frame.addEventListener('load',()=>setTimeout(boot,80));
</script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
